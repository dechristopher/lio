# cloudflared tunnel config for octad.gg
#
# Ingress for the Cloudflare Access tunnel that fronts the app (see
# deploy/docker-compose.yaml — TLS terminates at Cloudflare, the app is
# published on loopback only). This is the host-run cloudflared layout: the
# daemon runs on the deploy host and reaches the app at http://localhost:4444.
#
# Install/run (host):
#   cloudflared tunnel login
#   cloudflared tunnel create octad-gg           # prints the tunnel UUID + creds file
#   cloudflared tunnel route dns octad-gg octad.gg
#   cloudflared tunnel route dns octad-gg www.octad.gg
#   sudo cloudflared --config /etc/cloudflared/config.yml tunnel run
#   # (or install as a service: cloudflared service install)
#
# The `route dns` calls create the proxied CNAMEs (octad.gg ->
# <UUID>.cfargotunnel.com). www is optional — if you add the www->apex Single
# Redirect (see deploy/CLOUDFLARE.md) www never reaches the tunnel and you can
# drop its ingress entry below.

tunnel: octad-gg
credentials-file: /etc/cloudflared/octad-gg.json

# Applied to every ingress rule unless overridden per-hostname.
originRequest:
  connectTimeout: 30s
  # The app speaks plain HTTP on loopback; no TLS between cloudflared and origin.
  noTLSVerify: false

ingress:
  # Apex — the app. If you run cloudflared as a container on the compose
  # network instead of on the host, change this to http://lioctad:4444 and drop
  # the loopback `ports` mapping in docker-compose.yaml.
  - hostname: octad.gg
    service: http://localhost:4444

  # www — served by the same app. Prefer redirecting www->apex at the edge
  # (CLOUDFLARE.md) and removing this entry; kept here as a safe fallback.
  - hostname: www.octad.gg
    service: http://localhost:4444

  # status.octad.gg is a SEPARATE service (status page), not this app — route it
  # in its own tunnel/DNS, not here.

  # Required catch-all: anything not matched above returns 404 rather than
  # tunneling to the app.
  - service: http_status:404
